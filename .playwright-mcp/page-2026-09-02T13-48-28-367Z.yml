      - paragraph [ref=f5e19]: Thư ngỏ từ Queenie
      - blockquote [ref=f5e20]:
        - generic [ref=f5e21]: Bắt đầu muộn,
        - generic [ref=f5e22]: nhưng chưa bao giờ là quá muộn.
      - paragraph [ref=f5e23]: Mình là Nguyễn Hồng Nguyệt Quế, hay Queenie. Trước khi đến với tiếng Hàn, mình có 10 năm làm việc trong ngành ngân hàng tại Shinhan, ANZ và HSBC. Trong suốt quãng thời gian đó, tiếng Hàn hoàn toàn không nằm trong công việc hay cuộc sống của mình.
      - paragraph [ref=f5e24]: Năm 2022, sau khi rời HSBC và sang Hàn Quốc, mình bắt đầu học tiếng Hàn tại 울산과학대학교 (Ulsan College). Từ những bước đầu tiên, mình từng bước xây dựng nền tảng tiếng Hàn và tiếp tục theo đuổi con đường học thuật. Đến năm 2026, mình hoàn thành chương trình Thạc sĩ Biên–Phiên dịch Hàn–Việt tại 국제언어대학원대학교 (IGSE).
      - paragraph [ref=f5e25]: Vì vậy, khi một học viên nói “em bắt đầu muộn quá”, mình hiểu cảm giác đó — bởi mình cũng từng nghĩ như vậy.
