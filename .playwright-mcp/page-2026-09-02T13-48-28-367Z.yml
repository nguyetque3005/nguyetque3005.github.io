            - paragraph [ref=f5e51]: Hành trình 5 năm của mình tại Shinhan Bank là bước tiến từ One-Stop Services đến International Banking Department. Tại đây, mình trực tiếp tư vấn và xử lý các nghiệp vụ tài trợ thương mại xuất nhập khẩu cũng như chuyển tiền quốc tế cho cả khách hàng cá nhân lẫn doanh nghiệp.
            - paragraph [ref=f5e52]: Cột mốc đáng nhớ nhất là khi mình vinh dự nhận giải thưởng Nhân viên xuất sắc năm 2016 và đại diện chi nhánh tham gia chương trình Global Young Force tại Hàn Quốc. 5 năm thực chiến tại Shinhan đã trang bị cho mình nền tảng kiến thức tài chính – ngân hàng vững chắc cùng tư duy làm việc chuyên nghiệp.
