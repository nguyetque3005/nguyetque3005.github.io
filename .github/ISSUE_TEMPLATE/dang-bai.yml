# Phiếu nộp bài. Mở: .../issues/new?template=dang-bai.yml — lưu link đó ra
# màn hình chính điện thoại là thành "nút đăng bài".
#
# Nhãn của từng ô phải khớp với bảng KHOA trong scripts/nop-bai.py; đổi chữ ở
# đây thì đổi cả bên đó.
name: Đăng bài mới
description: Dán link Google Docs, điền thông tin, máy tự dựng bài và đăng lên web
title: "Đăng bài"   # điền sẵn vào ô tiêu đề; viết thêm vào sau cũng được
body:
  - type: markdown
    attributes:
      value: |
        Tài liệu Google Docs cứ để nguyên, không phải thêm gì vào trong đó.
        Chỉ cần chia sẻ ở chế độ **Bất kỳ ai có đường liên kết**.

  - type: input
    id: link
    attributes:
      label: Link Google Docs
      placeholder: https://docs.google.com/document/d/...
    validations:
      required: true

  - type: input
    id: tieu-de
    attributes:
      label: Tiêu đề bài viết
      description: Tên bài hiện trên web. Dòng đầu tài liệu trùng với tên này thì máy tự bỏ đi cho khỏi lặp.
    validations:
      required: true

  - type: input
    id: ngay
    attributes:
      label: Ngày đăng
      placeholder: 22/09/2026
    validations:
      required: true

  - type: checkboxes
    id: the
    attributes:
      label: Thẻ
      description: Tick những thẻ hợp với bài. Thẻ đầu tiên cũng là chữ hiện trên thẻ bài viết ngoài trang Tài liệu.
      options:
        - label: Câu 51
        - label: Câu 52
        - label: Câu 53
        - label: Câu 54
        - label: Luyện nghe
        - label: Luyện đọc
        - label: Luyện viết
        - label: Từ vựng
        - label: Ngữ pháp
        - label: Trợ từ
        - label: Kinh nghiệm

  - type: input
    id: banner
    attributes:
      label: Chữ trên banner
      description: "Bỏ trống thì banner ghi đúng tiêu đề bài. Muốn tự chọn chỗ xuống dòng thì đặt `<br>` vào đúng chỗ đó."

  - type: textarea
    id: tom-tat
    attributes:
      label: Tóm tắt
      description: Một câu hiện ở đầu bài và trên thẻ bài viết. Cắt từ chính câu chữ trong tài liệu, đừng viết câu mới.
