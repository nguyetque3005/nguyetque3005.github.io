# Nộp bài từ Google Docs: mở một issue theo phiếu "Đăng bài mới", dán link.
#
# Thông tin bài lấy từ chính các ô trên phiếu; tài liệu Google Docs để nguyên.
#
#   thiếu thông tin  -> máy ghi rõ chỗ phải sửa vào issue rồi đóng lại.
#                       Sửa trong Docs xong bấm "Reopen" là nộp lại.
#   đủ thông tin     -> dựng bài + banner, commit lên nhánh source,
#                       chạy tiếp workflow dựng website.
#
# Chỉ chủ repo và cộng tác viên nộp được — người lạ mở issue thì máy bỏ qua.
# Workflow chạy theo issue luôn được đọc từ nhánh mặc định của repo,
# nên nhánh mặc định trên GitHub phải để là "source".

name: Nộp bài từ Google Docs

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: nop-bai-${{ github.event.issue.number }}

jobs:
  nop-bai:
    # Nhận phiếu theo tiêu đề biểu mẫu đặt sẵn, hoặc theo link Docs nằm trong
    # thân phiếu — sửa tiêu đề đi thì vẫn chạy. Issue thường thì bỏ qua.
    if: >
      (startsWith(github.event.issue.title, 'Đăng bài') ||
       contains(github.event.issue.body, 'docs.google.com/document')) &&
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    outputs:
      xong: ${{ steps.dung.outcome == 'success' }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Cài Pillow và phông chữ Hàn cho banner
        run: |
          pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      # Thân phiếu là chữ người dùng gõ — truyền qua biến môi trường rồi ghi
      # ra file, không ghép thẳng vào lệnh shell.
      - name: Dựng bài
        id: dung
        continue-on-error: true
        env:
          THAN: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$THAN" > phieu.txt
          python3 scripts/nop-bai.py --phieu=phieu.txt > ket-qua.txt 2>&1
          cat ket-qua.txt

      - name: Báo lỗi vào issue
        if: steps.dung.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Chưa đăng được."
            echo
            echo '```'
            cat ket-qua.txt
            echo '```'
            echo
            echo "Sửa trong Google Docs xong thì bấm **Reopen** ở dưới để nộp lại."
          } > loi.md
          gh issue close ${{ github.event.issue.number }} -c "$(cat loi.md)"
          exit 1

      - name: Dựng banner và commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BAI=$(tail -n 1 ket-qua.txt)
          python3 scripts/tao-banner.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog assets/banner
          git commit -q -m "Đăng bài từ tài liệu (issue #${{ github.event.issue.number }})

          $BAI

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:source

          SLUG=$(basename "$BAI" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
          gh issue close ${{ github.event.issue.number }} \
            -c "Đã đăng: https://nguyetque3005.github.io/blog/$SLUG.html

          Khoảng một phút nữa bài sẽ hiện trên web. Xem thấy chỗ nào sai thì sửa trong Google Docs rồi bấm **Reopen** — bài sẽ được dựng lại đè lên bản cũ."

      # Lưới an toàn: hỏng ở khâu banner hay khâu push thì vẫn phải báo,
      # đừng để phiếu nằm im không ai biết.
      - name: Báo lỗi kỹ thuật
        if: failure() && steps.dung.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            -c "Bài đọc được nhưng khâu dựng banner hoặc khâu đăng bị lỗi kỹ thuật. Nhờ Cody xem tab **Actions** giúp."

  dang-web:
    needs: nop-bai
    if: needs.nop-bai.outputs.xong == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
